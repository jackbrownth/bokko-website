# BOKKO — Netlify configuration
#
# Keep this file at the ROOT of the site (same level as index.html).
# The site is plain static files: there is no build step and no [build]
# section here on purpose. Do not replace this file with the netlify.toml
# found inside a "Download deployed files" zip from Netlify: that copy is
# Netlify's own export and contains a publish path from one computer,
# which makes the next deploy fail.

[images]
  remote_images = ["https://firebasestorage.googleapis.com/.*"]

# ---------------------------------------------------------------- Redirects
# Order matters: keep the media rule first.

# 1. Real files under /portfolio/media/ are served as-is.
[[redirects]]
  from = "/portfolio/media/*"
  to = "/portfolio/media/:splat"
  status = 200

# 2. /portfolio or /portfolio/ with no client code goes to the homepage.
#    force is required because /portfolio/index.html is a real file.
[[redirects]]
  from = "/portfolio"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio/"
  to = "/"
  status = 301
  force = true

# 3. Every other /portfolio/<code> URL serves the portfolio page, which
#    reads the code from the URL and looks it up in Firestore.
[[redirects]]
  from = "/portfolio/*"
  to = "/portfolio/index.html"
  status = 200

# ------------------------------------------------------------------ Headers

# Client proposal links and the admin should not appear in search results.
[[headers]]
  for = "/portfolio/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Long cache on portfolio videos: their names are unique per upload.
[[headers]]
  for = "/portfolio/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/showreel/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
