headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[images]
remote_images = [
  "https://firebasestorage.googleapis.com/.*"
]

[functions]

  [functions."*"]

[build]
publish = "/Users/Jack/Downloads/bokko"
publishOrigin = "default"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/portfolio/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/portfolio/media/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/admin.html"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/admin"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/assets/*"

  [headers.values]
  Cache-Control = "public, max-age=86400"

[[headers]]
for = "/showreel/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/*.png"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/*.ico"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[redirects]]
from = "/portfolio/media/*"
to = "/portfolio/media/:splat"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/portfolio"
to = "/"
status = 301
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/portfolio/"
to = "/"
status = 301
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/portfolio/*"
to = "/portfolio/index.html"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]